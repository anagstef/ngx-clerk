name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'MIGRATION.md'
      - 'scripts/generate-llms.mjs'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'MIGRATION.md'
      - 'scripts/generate-llms.mjs'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node ../scripts/generate-llms.mjs
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: website
      - run: bundle exec jekyll build --baseurl "/ngx-clerk"
        env:
          JEKYLL_ENV: production
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
